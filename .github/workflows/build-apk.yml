name: Build Mishwark APKs

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL"
        required: true
        default: "https://mishwark-eta.vercel.app/api"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q mishwark_release_candidate_1_0-1.zip -d project
          echo "Flutter project extracted successfully"

      - name: Fix passenger trip screen
        run: |
          python3 -c "from pathlib import Path; p=Path('project/apps/passenger_app/lib/screens/trip_flow_screen.dart'); s=p.read_text(); s=s.replace('const Text('\''تقييم 5 نجوم'\'')]]);}', 'const Text('\''تقييم 5 نجوم'\'')]);}'); p.write_text(s)"
          echo "Passenger screen checked"

      - name: Create passenger Android project
        working-directory: project/apps/passenger_app
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Build passenger APK
        working-directory: project/apps/passenger_app
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://mishwark-eta.vercel.app/api' }}
        run: |
          flutter build apk --release --dart-define=API_URL="$API_URL"

      - name: Copy passenger APK
        run: |
          mkdir -p artifacts
          cp project/apps/passenger_app/build/app/outputs/flutter-apk/app-release.apk artifacts/mishwark-passenger.apk
          echo "Passenger APK copied"

