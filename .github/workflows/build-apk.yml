name: Build Mishwark APKs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract demo project
        run: |
          rm -rf project
          mkdir project
          unzip -q mishwark_demo_otp_bypass_fixed_v3.zip -d project

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build passenger APK
        working-directory: project/apps/passenger_app
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
          mkdir -p ../../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../../artifacts/mishwark-passenger-demo.apk

      - name: Build driver APK
        working-directory: project/apps/driver_app
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
          mkdir -p ../../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../../artifacts/mishwark-driver-demo.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mishwark-demo-apks
          path: project/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
