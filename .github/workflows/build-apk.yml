name: Build Mishwark APKs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q mishwark_release_candidate_1_0-1.zip -d project

      - name: Build passenger APK
        working-directory: project/apps/passenger_app
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release --dart-define=API_URL=https://mishwark-eta.vercel.app

      - name: Copy passenger APK
        run: |
          mkdir -p artifacts
          cp project/apps/passenger_app/build/app/outputs/flutter-apk/app-release.apk artifacts/mishwark-passenger.apk

      - name: Build driver APK
        working-directory: project/apps/driver_app
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release --dart-define=API_URL=https://mishwark-eta.vercel.app

      - name: Copy driver APK
        run: |
          cp project/apps/driver_app/build/app/outputs/flutter-apk/app-release.apk artifacts/mishwark-driver.apk

      - name: Check APKs
        run: |
          ls -lh artifacts
          test -f artifacts/mishwark-passenger.apk
          test -f artifacts/mishwark-driver.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mishwark-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
