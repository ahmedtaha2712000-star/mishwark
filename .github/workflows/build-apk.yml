name: Build Mishwark APKs

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL"
        required: true
        default: "https://mishwark-eta.vercel.app"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q mishwark_release_candidate_1_0-1.zip -d project
          echo "Flutter project extracted successfully"

      - name: Fix passenger screen
        run: |
          sed -i 's/]])));}/]]))));}/' project/apps/passenger_app/lib/screens/trip_flow_screen.dart
          echo "Passenger screen checked"

      - name: Install passenger dependencies
        working-directory: project/apps/passenger_app
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Build passenger APK
        working-directory: project/apps/passenger_app
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://mishwark-eta.vercel.app' }}
        run: |
          flutter build apk --release --dart-define=API_URL="$API_URL"

      - name: Copy passenger APK
        run: |
          mkdir -p artifacts
          cp project/apps/passenger_app/build/app/outputs/flutter-apk/app-release.apk artifacts/mishwark-passenger.apk

      - name: Install driver dependencies
        working-directory: project/apps/driver_app
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Build driver APK
        working-directory: project/apps/driver_app
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://mishwark-eta.vercel.app' }}
        run: |
          flutter build apk --release --dart-define=API_URL="$API_URL"

      - name: Copy driver APK
        run: |
          cp project/apps/driver_app/build/app/outputs/flutter-apk/app-release.apk artifacts/mishwark-driver.apk

      - name: Verify APK files
        run: |
          ls -lh artifacts/
          test -f artifacts/mishwark-passenger.apk
          test -f artifacts/mishwark-driver.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mishwark-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
