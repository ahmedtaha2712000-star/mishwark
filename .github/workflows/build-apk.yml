name: Build Mishwark APKs

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL"
        required: true
        default: "https://mishwark-eta.vercel.app"
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          rm -rf project
          mkdir project
          unzip -q mishwark_release_candidate_1_0-1.zip -d project

      - name: Build passenger APK
        working-directory: project/apps/passenger_app
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://mishwark-eta.vercel.app' }}
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release --dart-define=API_URL="$API_URL"
          mkdir -p ../../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../../artifacts/mishwark-passenger.apk

      - name: Build driver APK
        working-directory: project/apps/driver_app
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://mishwark-eta.vercel.app' }}
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release --dart-define=API_URL="$API_URL"
          mkdir -p ../../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../../artifacts/mishwark-driver.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mishwark-apks
          path: project/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
