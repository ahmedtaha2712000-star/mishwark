<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشوار - لوحة الإدارة</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      text-align: center;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      overflow-x: auto;
    }

    h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: right;
    }

    th {
      background: #f7f8fa;
    }

    .status {
      font-weight: bold;
    }

    .online {
      color: green;
    }

    .offline {
      color: #888;
    }

    #loading {
      text-align: center;
      padding: 30px;
    }

    #error {
      background: #ffe5e5;
      color: #a00000;
      padding: 15px;
      border-radius: 10px;
      display: none;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚕 مشوار</h1>
  <div>لوحة إدارة التطبيق</div>
</header>

<div class="container">

  <div id="loading">جاري تحميل البيانات...</div>

  <div id="error"></div>

  <div class="cards">
    <div class="card">
      <div>السائقين</div>
      <div class="number" id="driversCount">0</div>
    </div>

    <div class="card">
      <div>الركاب</div>
      <div class="number" id="passengersCount">0</div>
    </div>

    <div class="card">
      <div>رحلات اليوم</div>
      <div class="number" id="todayTrips">0</div>
    </div>

    <div class="card">
      <div>الرحلات النشطة</div>
      <div class="number" id="activeTrips">0</div>
    </div>
  </div>

  <div class="section">
    <h2>🚗 السائقين</h2>

    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>السيارة</th>
          <th>التقييم</th>
          <th>الحالة</th>
        </tr>
      </thead>

      <tbody id="driversTable"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>👤 الركاب</h2>

    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>الحالة</th>
          <th>عدد الرحلات</th>
        </tr>
      </thead>

      <tbody id="passengersTable"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>🚕 الرحلات</h2>

    <table>
      <thead>
        <tr>
          <th>رقم الرحلة</th>
          <th>من</th>
          <th>إلى</th>
          <th>السعر</th>
          <th>الحالة</th>
        </tr>
      </thead>

      <tbody id="tripsTable"></tbody>
    </table>
  </div>

</div>

<script>
const API_URL =
  "https://mishwark-eta.vercel.app/api/admin/dashboard";

async function loadDashboard() {
  try {
    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("فشل الاتصال بالخادم");
    }

    const data = await response.json();

    document.getElementById("driversCount").textContent =
      data.driversCount;

    document.getElementById("passengersCount").textContent =
      data.passengersCount;

    document.getElementById("todayTrips").textContent =
      data.todayTrips;

    document.getElementById("activeTrips").textContent =
      data.activeTrips;

    document.getElementById("driversTable").innerHTML =
      data.drivers.map(driver => `
        <tr>
          <td>${driver.name}</td>
          <td>${driver.car}</td>
          <td>⭐ ${driver.rating}</td>
          <td class="status ${
            driver.status === "متصل" ? "online" : "offline"
          }">${driver.status}</td>
        </tr>
      `).join("");

    document.getElementById("passengersTable").innerHTML =
      data.passengers.map(passenger => `
        <tr>
          <td>${passenger.name}</td>
          <td>${passenger.status}</td>
          <td>${passenger.trips}</td>
        </tr>
      `).join("");

    document.getElementById("tripsTable").innerHTML =
      data.trips.map(trip => `
        <tr>
          <td>${trip.id}</td>
          <td>${trip.from}</td>
          <td>${trip.to}</td>
          <td>${trip.price} جنيه</td>
          <td>${trip.status}</td>
        </tr>
      `).join("");

    document.getElementById("loading").style.display = "none";

  } catch (error)
